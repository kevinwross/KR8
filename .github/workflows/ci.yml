name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
          -DKR8_BUILD_UI=ON -DKR8_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/windows --config Debug
      - name: Test
        run: ctest --test-dir build/windows -C Debug --output-on-failure

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ xvfb xdotool imagemagick
      - name: Configure
        run: >
          cmake -S . -B build/linux -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKR8_BUILD_UI=ON -DKR8_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/linux
      - name: Test
        run: ctest --test-dir build/linux --output-on-failure
      - name: UI smoke (Xvfb)
        run: >
          tests/ui_smoke_linux.sh build/linux/kr8_ui_smoke
          build/linux/tests/hello.k8 build/linux/ui-smoke.png

  linux-sanitize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
      - name: Configure
        run: >
          cmake -S . -B build/sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKR8_BUILD_UI=OFF -DKR8_BUILD_TESTS=ON -DKR8_SANITIZE=ON
      - name: Build
        run: cmake --build build/sanitize
      - name: Test
        run: ctest --test-dir build/sanitize --output-on-failure
