name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build/release -G "Visual Studio 17 2022" -A x64
          -DKR8_BUILD_UI=ON -DKR8_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build/release --config Release
      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/kr8-0.2.2-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/release/Release/kr8.exe $stage
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $stage
          Copy-Item docs, examples $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath dist/kr8-0.2.2-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kr8-windows
          path: dist/kr8-0.2.2-win64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.x"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ xvfb xdotool imagemagick
          curl -L --fail -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
      - name: Configure
        run: >
          cmake --preset linux-gcc-release -DKR8_BUILD_UI=ON
          -DKR8_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build --preset linux-gcc-release
      - name: Test
        run: ctest --preset linux-gcc-release
      - name: Package
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/linux-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kr8-linux
          path: dist/KR8-x86_64.AppImage

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kr8-windows/kr8-0.2.2-win64.zip
            dist/kr8-linux/KR8-x86_64.AppImage
